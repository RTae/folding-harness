[package]
name = "fh-fold"
description = "Fold backends: the FoldBackend trait, a deterministic in-process fixture, an HTTP client, and a stub service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# The stub service. Off by default so a client build does not pull in axum.
server = ["axum", "tokio/net", "tokio/rt-multi-thread"]

[dependencies]
fh-core.workspace = true
fh-contract.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio = { workspace = true }
reqwest.workspace = true
axum = { workspace = true, optional = true }
