[package]
name = "pairstack-fixture-reader"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "Reads the pair-stack oracle fixtures and checks them against the manifest, with no Python present"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
